<line x1="690" y1="404.0" x2="1140" y2="404.0" stroke="#E6E2D6" stroke-width="2"/>
<text x="678" y="411.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="end" >25</text>
<line x1="690" y1="326.0" x2="1140" y2="326.0" stroke="#E6E2D6" stroke-width="2"/>
<text x="678" y="333.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="end" >30</text>
<line x1="690" y1="248.0" x2="1140" y2="248.0" stroke="#E6E2D6" stroke-width="2"/>
<text x="678" y="255.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="end" >35</text>
<text x="783.75" y="592" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle" >8</text>
<text x="871.25" y="592" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle" >12</text>
<text x="958.75" y="592" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle" >16</text>
<text x="1046.25" y="592" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle" >20</text>
<text x="915.0" y="628" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#3D3929" text-anchor="middle" >Cores</text>
<polyline points="783.8,335.4 871.2,273.0 958.8,400.9 1046.2,478.9" fill="none" stroke="#3D3929" stroke-width="3"/>
<circle cx="783.75" cy="335.36" r="9" fill="#3D3929" stroke="none" stroke-width="2"/>
<circle cx="871.25" cy="272.96000000000004" r="9" fill="#D97757" stroke="none" stroke-width="2"/>
<circle cx="958.75" cy="400.88" r="9" fill="#3D3929" stroke="none" stroke-width="2"/>
<circle cx="1046.25" cy="478.88" r="9" fill="#3D3929" stroke="none" stroke-width="2"/>
<text x="783.75" y="371.36" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#3D3929" text-anchor="middle" >8 cores: 29.4 s</text>
<text x="871.25" y="252.96000000000004" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D97757" text-anchor="middle" >12 cores: 33.4 s</text>
<text x="980.75" y="386.88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#3D3929" text-anchor="start" >16: 25.2 s</text>
<text x="1036.25" y="514.88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#3D3929" text-anchor="middle" >20: 20.2 s</text>
<text x="60" y="668" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8A8470" text-anchor="start" >Original benchmark: 10000 x 10000 grid, 500 generations, one node. Serial run: 250.7 s.</text>
<text x="60" y="696" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8A8470" text-anchor="start" >Numbers are from the original lesson; we did not reproduce them. The original gives no reason for the dip.</text>
</svg>
