<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <title>The 80% rule before adding GPUs</title>
  <desc>A utilization scale for one GPU marking under 60 percent as fix first and above 80 percent as the point where more GPUs help, with a picture of one card at 20 percent becoming four cards at 20 percent.</desc>
  <rect width="1200" height="680" fill="#F2F0E9"/>
  <text x="600" y="72" text-anchor="middle" font-family="EB Garamond, Georgia, serif" font-size="46" fill="#3D3929">The 80% rule</text>
  <text x="600" y="112" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#8A8470">More GPUs multiply the efficiency you already have</text>
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="100" y="170" font-size="22" font-weight="600" fill="#3D3929">Utilization of ONE GPU: do more cards help?</text>
    <rect x="100" y="190" width="600" height="70" fill="#D97757" fill-opacity="0.16" stroke="#D97757" stroke-width="3"/>
    <rect x="700" y="190" width="200" height="70" fill="#E6E2D6" stroke="#CFC9B8" stroke-width="3"/>
    <rect x="900" y="190" width="200" height="70" fill="#FAF9F5" stroke="#3D3929" stroke-width="3"/>
    <text x="400" y="234" text-anchor="middle" font-size="24" fill="#3D3929">No: fix this first</text>
    <text x="800" y="234" text-anchor="middle" font-size="22" fill="#8A8470">Not settled</text>
    <text x="1000" y="234" text-anchor="middle" font-size="24" fill="#3D3929">Yes</text>
    <text x="100" y="296" text-anchor="middle" font-size="20" fill="#3D3929">0%</text>
    <text x="700" y="296" text-anchor="middle" font-size="20" fill="#3D3929">60%</text>
    <text x="900" y="296" text-anchor="middle" font-size="20" fill="#3D3929">80%</text>
    <text x="1100" y="296" text-anchor="middle" font-size="20" fill="#3D3929">100%</text>

    <text x="100" y="365" font-size="22" font-weight="600" fill="#3D3929">What 20% looks like when you buy more cards</text>
    <rect x="120" y="395" width="120" height="150" rx="10" fill="#FAF9F5" stroke="#3D3929" stroke-width="2.5"/>
    <rect x="124" y="511.0" width="112" height="30.0" rx="4" fill="#D97757"/>
    <text x="180.0" y="499.0" text-anchor="middle" font-size="22" font-weight="600" fill="#3D3929">20%</text>
    <rect x="560" y="395" width="120" height="150" rx="10" fill="#FAF9F5" stroke="#3D3929" stroke-width="2.5"/>
    <rect x="564" y="511.0" width="112" height="30.0" rx="4" fill="#D97757"/>
    <text x="620.0" y="499.0" text-anchor="middle" font-size="22" font-weight="600" fill="#3D3929">20%</text>
    <rect x="700" y="395" width="120" height="150" rx="10" fill="#FAF9F5" stroke="#3D3929" stroke-width="2.5"/>
    <rect x="704" y="511.0" width="112" height="30.0" rx="4" fill="#D97757"/>
    <text x="760.0" y="499.0" text-anchor="middle" font-size="22" font-weight="600" fill="#3D3929">20%</text>
    <rect x="840" y="395" width="120" height="150" rx="10" fill="#FAF9F5" stroke="#3D3929" stroke-width="2.5"/>
    <rect x="844" y="511.0" width="112" height="30.0" rx="4" fill="#D97757"/>
    <text x="900.0" y="499.0" text-anchor="middle" font-size="22" font-weight="600" fill="#3D3929">20%</text>
    <rect x="980" y="395" width="120" height="150" rx="10" fill="#FAF9F5" stroke="#3D3929" stroke-width="2.5"/>
    <rect x="984" y="511.0" width="112" height="30.0" rx="4" fill="#D97757"/>
    <text x="1040.0" y="499.0" text-anchor="middle" font-size="22" font-weight="600" fill="#3D3929">20%</text>
    <text x="180" y="580" text-anchor="middle" font-size="22" fill="#3D3929">1 card</text>
    <text x="770" y="580" text-anchor="middle" font-size="22" fill="#3D3929">4 cards, each at 20%</text>
    <line x1="270" y1="470" x2="500" y2="470" stroke="#3D3929" stroke-width="3"/>
    <polygon points="500,458 524,470 500,482" fill="#3D3929"/>
    <text x="385" y="452" text-anchor="middle" font-size="22" fill="#3D3929">ask for 4</text>
    <text x="600" y="640" text-anchor="middle" font-size="24" font-weight="600" fill="#D97757">Same waste, four times the allocation</text>
  </g>
</svg>
