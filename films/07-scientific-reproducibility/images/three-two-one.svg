<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<title>The 3-2-1 backup rule</title>
<desc>Three copies of the data, on two kinds of storage, with one copy off-site, and a note that scratch space does not count as a copy.</desc>
<rect width="1200" height="620" fill="#F2F0E9"/>
<text x="60" y="80" font-family="EB Garamond, Georgia, serif" font-size="44" font-weight="500" fill="#3D3929" text-anchor="start" >3-2-1 backup</text>
<text x="60" y="118" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8A8470" text-anchor="start" >Three copies, two kinds of storage, one off-site</text>
<rect x="65.0" y="170" width="330" height="200" rx="14" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2"/>
<text x="230.0" y="230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#8A8470" text-anchor="middle" >Copy 1</text>
<text x="230.0" y="282" font-family="EB Garamond, Georgia, serif" font-size="34" font-weight="600" fill="#3D3929" text-anchor="middle" >Working copy</text>
<text x="230.0" y="328" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#8A8470" text-anchor="middle" >Storage kind A</text>
<rect x="435.0" y="170" width="330" height="200" rx="14" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2"/>
<text x="600.0" y="230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#8A8470" text-anchor="middle" >Copy 2</text>
<text x="600.0" y="282" font-family="EB Garamond, Georgia, serif" font-size="34" font-weight="600" fill="#3D3929" text-anchor="middle" >Second copy</text>
<text x="600.0" y="328" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#8A8470" text-anchor="middle" >Storage kind B</text>
<rect x="805.0" y="170" width="330" height="200" rx="14" fill="#FAF9F5" stroke="#D97757" stroke-width="4"/>
<text x="970.0" y="230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#8A8470" text-anchor="middle" >Copy 3</text>
<text x="970.0" y="282" font-family="EB Garamond, Georgia, serif" font-size="34" font-weight="600" fill="#D97757" text-anchor="middle" >Off-site copy</text>
<text x="970.0" y="328" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#8A8470" text-anchor="middle" >Elsewhere</text>
<path d="M65.0 396 v14 H765.0 v-14" stroke="#3D3929" stroke-width="2.5" fill="none"/>
<text x="415.0" y="442" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#3D3929" text-anchor="middle" >Two kinds of storage</text>
<path d="M805.0 396 v14 H1135.0 v-14" stroke="#D97757" stroke-width="2.5" fill="none"/>
<text x="970.0" y="442" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#D97757" text-anchor="middle" >One off-site</text>
<rect x="65.0" y="500" width="1070" height="64" rx="12" fill="#E6E2D6" stroke="#E6E2D6" stroke-width="0"/>
<line x1="95.0" y1="520" x2="119.0" y2="544" stroke="#D97757" stroke-width="4"/><line x1="119.0" y1="520" x2="95.0" y2="544" stroke="#D97757" stroke-width="4"/>
<text x="141.0" y="541" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#3D3929" text-anchor="start" >Explorer scratch is purged: not one of the three</text>
</svg>
