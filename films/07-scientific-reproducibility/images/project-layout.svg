<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<title>Project folder layout with raw data never edited</title>
<desc>A folder tree for a research project with data split into raw, processed and metadata, and the raw folder marked as never edited.</desc>
<rect width="1200" height="800" fill="#F2F0E9"/>
<text x="60" y="80" font-family="EB Garamond, Georgia, serif" font-size="44" font-weight="500" fill="#3D3929" text-anchor="start" >One project, one layout</text>
<text x="60" y="118" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8A8470" text-anchor="start" >Raw data is the one folder you never edit</text>
<rect x="60" y="150" width="1080" height="610" rx="14" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2"/>
<path d="M100 184 h14 l4 5 h16 v22 h-34 z" fill="#8A8470" fill-opacity="0.25" stroke="#8A8470" stroke-width="2.5" stroke-linejoin="round"/>
<text x="150" y="203" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#3D3929" text-anchor="start" >research_project/</text>
<path d="M164 243 h20 l8 8 v22 h-28 z" fill="none" stroke="#8A8470" stroke-width="2.5" stroke-linejoin="round"/>
<text x="210" y="263" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#3D3929" text-anchor="start" >README.md</text>
<text x="660" y="263" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8A8470" text-anchor="start" >What it is and how to rerun</text>
<path d="M164 303 h20 l8 8 v22 h-28 z" fill="none" stroke="#8A8470" stroke-width="2.5" stroke-linejoin="round"/>
<text x="210" y="323" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#3D3929" text-anchor="start" >environment.yml</text>
<text x="660" y="323" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8A8470" text-anchor="start" >The software, pinned</text>
<path d="M160 364 h14 l4 5 h16 v22 h-34 z" fill="#8A8470" fill-opacity="0.25" stroke="#8A8470" stroke-width="2.5" stroke-linejoin="round"/>
<text x="210" y="383" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#3D3929" text-anchor="start" >src/</text>
<text x="660" y="383" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8A8470" text-anchor="start" >Your code</text>
<path d="M160 424 h14 l4 5 h16 v22 h-34 z" fill="#8A8470" fill-opacity="0.25" stroke="#8A8470" stroke-width="2.5" stroke-linejoin="round"/>
<text x="210" y="443" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#3D3929" text-anchor="start" >data/</text>
<rect x="206" y="466" width="880" height="50" rx="10" fill="#FBEBE4" stroke="#D97757" stroke-width="3"/>
<path d="M220 484 h14 l4 5 h16 v22 h-34 z" fill="#D97757" fill-opacity="0.25" stroke="#D97757" stroke-width="2.5" stroke-linejoin="round"/>
<text x="270" y="503" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="600" fill="#D97757" text-anchor="start" >raw/</text>
<text x="660" y="503" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#D97757" text-anchor="start" >Original, never edited</text>
<path d="M220 544 h14 l4 5 h16 v22 h-34 z" fill="#8A8470" fill-opacity="0.25" stroke="#8A8470" stroke-width="2.5" stroke-linejoin="round"/>
<text x="270" y="563" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#3D3929" text-anchor="start" >processed/</text>
<text x="660" y="563" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8A8470" text-anchor="start" >Cleaned, with a README of the steps</text>
<path d="M220 604 h14 l4 5 h16 v22 h-34 z" fill="#8A8470" fill-opacity="0.25" stroke="#8A8470" stroke-width="2.5" stroke-linejoin="round"/>
<text x="270" y="623" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#3D3929" text-anchor="start" >metadata/</text>
<text x="660" y="623" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8A8470" text-anchor="start" >Dictionaries, codebooks, sample IDs</text>
<path d="M160 664 h14 l4 5 h16 v22 h-34 z" fill="#8A8470" fill-opacity="0.25" stroke="#8A8470" stroke-width="2.5" stroke-linejoin="round"/>
<text x="210" y="683" font-family="Menlo, Consolas, monospace" font-size="26" font-weight="400" fill="#3D3929" text-anchor="start" >results/</text>
<text x="660" y="683" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8A8470" text-anchor="start" >Figures and tables</text>
</svg>
