<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670">
<title>One arrow overwrites, two arrows append</title>
<desc>Two panels showing a file holding one line: the single arrow replaces the contents, the double arrow keeps the old line and adds a new one.</desc>
<rect width="1200" height="670" fill="#F2F0E9"/>
<text x="600" y="70" font-family="EB Garamond, Georgia, serif" font-size="42" font-weight="400" fill="#3D3929" text-anchor="middle">Count the arrows before you press Return</text>
<rect x="60" y="110" width="520" height="520" rx="14" fill="#FAF9F5" stroke="#D97757" stroke-width="4"/>
<text x="320" y="170" font-family="Menlo, Consolas, Courier New, monospace" font-size="64" font-weight="700" fill="#D97757" text-anchor="middle">&gt;</text>
<text x="320" y="208" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#D97757" text-anchor="middle">overwrites</text>
<rect x="100" y="240" width="440" height="64" rx="10" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="120" y="282" font-family="Menlo, Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">echo "second line" &gt; notes.txt</text>
<text x="120" y="345" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="start">notes.txt before</text>
<rect x="100" y="360" width="440" height="56" rx="10" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="120" y="396" font-family="Menlo, Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">first line</text>
<line x1="320" y1="424" x2="320.0" y2="458.0" stroke="#3D3929" stroke-width="3" stroke-linecap="round"/>
<polygon points="320,462 313.9,449.4 326.1,449.4" fill="#3D3929"/>
<text x="120" y="495" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="start">notes.txt after</text>
<rect x="100" y="508" width="440" height="84" rx="10" fill="#FAF9F5" stroke="#D97757" stroke-width="3"/>
<text x="120" y="538" font-family="Menlo, Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#8A8470" text-anchor="start">first line</text>
<line x1="120" y1="530" x2="253.0" y2="530" stroke="#D97757" stroke-width="3" stroke-linecap="round"/>
<text x="120" y="572" font-family="Menlo, Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">second line</text>
<rect x="620" y="110" width="520" height="520" rx="14" fill="#E6E2D6" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="880" y="170" font-family="Menlo, Consolas, Courier New, monospace" font-size="64" font-weight="700" fill="#3D3929" text-anchor="middle">&gt;&gt;</text>
<text x="880" y="208" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3D3929" text-anchor="middle">appends</text>
<rect x="660" y="240" width="440" height="64" rx="10" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="680" y="282" font-family="Menlo, Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">echo "second line" &gt;&gt; notes.txt</text>
<text x="680" y="345" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="start">notes.txt before</text>
<rect x="660" y="360" width="440" height="56" rx="10" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="680" y="396" font-family="Menlo, Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">first line</text>
<line x1="880" y1="424" x2="880.0" y2="458.0" stroke="#3D3929" stroke-width="3" stroke-linecap="round"/>
<polygon points="880,462 873.9,449.4 886.1,449.4" fill="#3D3929"/>
<text x="680" y="495" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="start">notes.txt after</text>
<rect x="660" y="508" width="440" height="84" rx="10" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="3"/>
<text x="680" y="538" font-family="Menlo, Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">first line</text>
<text x="680" y="572" font-family="Menlo, Consolas, Courier New, monospace" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">second line</text>
<text x="320" y="630" font-family="Inter, Helvetica, Arial, sans-serif" font-size="1" font-weight="400" fill="#3D3929" text-anchor="middle"></text>
</svg>
