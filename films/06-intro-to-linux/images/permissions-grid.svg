<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<title>Permissions as a grid, and chmod 751</title>
<desc>A three by three grid of owner, group and others against read, write and execute with the values 4, 2 and 1, filled in for chmod 751, which is rwxr-x--x.</desc>
<rect width="1200" height="680" fill="#F2F0E9"/>
<text x="60" y="70" font-family="EB Garamond, Georgia, serif" font-size="42" font-weight="400" fill="#3D3929" text-anchor="start">Who may do what: chmod 751</text>
<text x="415.0" y="138" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#3D3929" text-anchor="middle">r  read</text>
<text x="415.0" y="172" font-family="Menlo, Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#8A8470" text-anchor="middle">= 4</text>
<text x="599.0" y="138" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#3D3929" text-anchor="middle">w  write</text>
<text x="599.0" y="172" font-family="Menlo, Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#8A8470" text-anchor="middle">= 2</text>
<text x="783.0" y="138" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#3D3929" text-anchor="middle">x  execute</text>
<text x="783.0" y="172" font-family="Menlo, Consolas, Courier New, monospace" font-size="26" font-weight="400" fill="#8A8470" text-anchor="middle">= 1</text>
<text x="952" y="160" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#3D3929" text-anchor="middle">digit</text>
<text x="300" y="248.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3D3929" text-anchor="end">owner (u)</text>
<rect x="330" y="190" width="170" height="100" rx="12" fill="#D97757" stroke="#D97757" stroke-width="2.5"/>
<text x="415.0" y="256.0" font-family="Menlo, Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#FAF9F5" text-anchor="middle">r</text>
<rect x="514" y="190" width="170" height="100" rx="12" fill="#D97757" stroke="#D97757" stroke-width="2.5"/>
<text x="599.0" y="256.0" font-family="Menlo, Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#FAF9F5" text-anchor="middle">w</text>
<rect x="698" y="190" width="170" height="100" rx="12" fill="#D97757" stroke="#D97757" stroke-width="2.5"/>
<text x="783.0" y="256.0" font-family="Menlo, Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#FAF9F5" text-anchor="middle">x</text>
<rect x="882" y="190" width="140" height="100" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="952" y="240" font-family="Menlo, Consolas, Courier New, monospace" font-size="44" font-weight="700" fill="#3D3929" text-anchor="middle">7</text>
<text x="952" y="272" font-family="Menlo, Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle">4+2+1</text>
<text x="300" y="362.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3D3929" text-anchor="end">group (g)</text>
<rect x="330" y="304" width="170" height="100" rx="12" fill="#D97757" stroke="#D97757" stroke-width="2.5"/>
<text x="415.0" y="370.0" font-family="Menlo, Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#FAF9F5" text-anchor="middle">r</text>
<rect x="514" y="304" width="170" height="100" rx="12" fill="#E6E2D6" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="599.0" y="370.0" font-family="Menlo, Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#8A8470" text-anchor="middle">-</text>
<rect x="698" y="304" width="170" height="100" rx="12" fill="#D97757" stroke="#D97757" stroke-width="2.5"/>
<text x="783.0" y="370.0" font-family="Menlo, Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#FAF9F5" text-anchor="middle">x</text>
<rect x="882" y="304" width="140" height="100" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="952" y="354" font-family="Menlo, Consolas, Courier New, monospace" font-size="44" font-weight="700" fill="#3D3929" text-anchor="middle">5</text>
<text x="952" y="386" font-family="Menlo, Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle">4+1</text>
<text x="300" y="476.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3D3929" text-anchor="end">others (o)</text>
<rect x="330" y="418" width="170" height="100" rx="12" fill="#E6E2D6" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="415.0" y="484.0" font-family="Menlo, Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#8A8470" text-anchor="middle">-</text>
<rect x="514" y="418" width="170" height="100" rx="12" fill="#E6E2D6" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="599.0" y="484.0" font-family="Menlo, Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#8A8470" text-anchor="middle">-</text>
<rect x="698" y="418" width="170" height="100" rx="12" fill="#D97757" stroke="#D97757" stroke-width="2.5"/>
<text x="783.0" y="484.0" font-family="Menlo, Consolas, Courier New, monospace" font-size="48" font-weight="700" fill="#FAF9F5" text-anchor="middle">x</text>
<rect x="882" y="418" width="140" height="100" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="952" y="468" font-family="Menlo, Consolas, Courier New, monospace" font-size="44" font-weight="700" fill="#3D3929" text-anchor="middle">1</text>
<text x="952" y="500" font-family="Menlo, Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle">1</text>
<text x="600" y="610" font-family="Menlo, Consolas, Courier New, monospace" font-size="34" font-weight="700" fill="#3D3929" text-anchor="middle">7 5 1  =  rwx r-x --x</text>
<text x="600" y="652" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#8A8470" text-anchor="middle">Each digit is the sum of the values of the permissions turned on.</text>
</svg>
