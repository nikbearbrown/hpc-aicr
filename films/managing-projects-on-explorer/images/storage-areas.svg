<svg xmlns="http://www.w3.org/2000/svg" width="1200" viewBox="0 0 1200 640">
<title>Three storage areas on Explorer</title>
<desc>Three cards compare home, scratch and projects by size, lifetime and who can see the files, with projects highlighted as the shared long-lived place.</desc>
<rect width="1200" height="640" fill="#F2F0E9"/>
<text x="60" y="78" font-family="EB Garamond, Georgia, serif" font-size="46" fill="#3D3929">Three places to put files on Explorer</text>
<g font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#3D3929">
<rect x="60" y="130" width="340" height="440" rx="14" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="86" y="186" font-family="EB Garamond, Georgia, serif" font-size="38">Home</text>
<text x="86" y="222" fill="#8A8470">/home/&lt;username&gt;</text>
<text x="86" y="280" fill="#8A8470">SIZE</text><text x="86" y="308">75 GB</text>
<text x="86" y="354" fill="#8A8470">FOR</text><text x="86" y="382">Your scripts, settings</text>
<text x="86" y="430" fill="#8A8470">WATCH OUT</text><text x="86" y="458">Fills first</text>
<text x="86" y="486">A full home breaks</text><text x="86" y="514">OnDemand sessions</text>

<rect x="430" y="130" width="340" height="440" rx="14" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="456" y="186" font-family="EB Garamond, Georgia, serif" font-size="38">Scratch</text>
<text x="456" y="222" fill="#8A8470">/scratch/&lt;username&gt;</text>
<text x="456" y="280" fill="#8A8470">SIZE</text><text x="456" y="308">Sources disagree</text>
<text x="456" y="354" fill="#8A8470">FOR</text><text x="456" y="382">Temporary job data</text>
<text x="456" y="430" fill="#8A8470">WATCH OUT</text><text x="456" y="458">Purged first Tuesday</text>
<text x="456" y="486">of each month</text><text x="456" y="514">Not backed up</text>

<rect x="800" y="130" width="340" height="440" rx="14" fill="#FAF9F5" stroke="#D97757" stroke-width="4"/>
<text x="826" y="186" font-family="EB Garamond, Georgia, serif" font-size="38" fill="#D97757">Projects</text>
<text x="826" y="222" fill="#8A8470">/projects/&lt;project&gt;</text>
<text x="826" y="280" fill="#8A8470">SIZE</text><text x="826" y="308">Free up to 35 TB</text>
<text x="826" y="354" fill="#8A8470">FOR</text><text x="826" y="382">Research data, shared</text>
<text x="826" y="410">pipelines</text>
<text x="826" y="458" fill="#8A8470">WATCH OUT</text><text x="826" y="486">The whole group can</text>
<text x="826" y="514">change it</text>
</g>
<text x="60" y="612" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#8A8470">Shared and long-lived goes in projects. Group membership decides who can write.</text>
</svg>
