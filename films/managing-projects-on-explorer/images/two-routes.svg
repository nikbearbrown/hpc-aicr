<svg xmlns="http://www.w3.org/2000/svg" width="1200" viewBox="0 0 1200 600">
<title>Two ways to change project membership</title>
<desc>Two flows reach the same result: a terminal route through a compute node using the project command, and a browser route through an Open OnDemand app.</desc>
<rect width="1200" height="600" fill="#F2F0E9"/>
<text x="60" y="78" font-family="EB Garamond, Georgia, serif" font-size="46" fill="#3D3929">Two ways to change who is in</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8A8470"/></marker>
<marker id="t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D97757"/></marker></defs>
<g font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#3D3929" text-anchor="middle">
<text x="60" y="150" text-anchor="start" font-size="22" font-weight="600">TERMINAL</text>
<rect x="60" y="170" width="220" height="90" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="170" y="222">Login node</text>
<rect x="340" y="170" width="260" height="90" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="470" y="206">srun, short,</text><text x="470" y="234">ib</text>
<rect x="660" y="170" width="220" height="90" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="770" y="206">Compute node</text><text x="770" y="234" fill="#8A8470">project command</text>
<line x1="282" y1="215" x2="336" y2="215" stroke="#8A8470" stroke-width="3" marker-end="url(#a)"/>
<line x1="602" y1="215" x2="656" y2="215" stroke="#8A8470" stroke-width="3" marker-end="url(#a)"/>

<text x="60" y="350" text-anchor="start" font-size="22" font-weight="600">BROWSER</text>
<rect x="60" y="370" width="220" height="90" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="170" y="406">Open</text><text x="170" y="434">OnDemand</text>
<rect x="340" y="370" width="260" height="90" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="470" y="406">Managing</text><text x="470" y="434">/projects app</text>
<rect x="660" y="370" width="220" height="90" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="770" y="406">Short job</text><text x="770" y="434" fill="#8A8470">under ten minutes</text>
<line x1="282" y1="415" x2="336" y2="415" stroke="#8A8470" stroke-width="3" marker-end="url(#a)"/>
<line x1="602" y1="415" x2="656" y2="415" stroke="#8A8470" stroke-width="3" marker-end="url(#a)"/>

<rect x="960" y="240" width="190" height="140" rx="14" fill="#FAF9F5" stroke="#D97757" stroke-width="4"/>
<text x="1055" y="296" font-family="EB Garamond, Georgia, serif" font-size="30" fill="#D97757">Group</text>
<text x="1055" y="332" font-family="EB Garamond, Georgia, serif" font-size="30" fill="#D97757">changed</text>
<path d="M884 215 L930 215 Q945 215 945 240 L945 290 Q945 310 958 310" fill="none" stroke="#D97757" stroke-width="3" marker-end="url(#t)"/>
<path d="M884 415 L930 415 Q945 415 945 390 L945 340 Q945 310 958 310" fill="none" stroke="#D97757" stroke-width="3" marker-end="url(#t)"/>
</g>
<text x="60" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#8A8470">The app lists only groups you already belong to and may modify.</text>
</svg>
