<svg xmlns="http://www.w3.org/2000/svg" width="1200" viewBox="0 0 1200 760">
<title>Project roles ladder</title>
<desc>Four steps from guest to PI showing what each role can do with the files and with the project command, with delegates limited to members.</desc>
<rect width="1200" height="760" fill="#F2F0E9"/>
<text x="60" y="78" font-family="EB Garamond, Georgia, serif" font-size="46" fill="#3D3929">Who can do what in a project</text>
<text x="60" y="116" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#8A8470">Each step does what the step below does, plus more</text>
<g font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#3D3929">
<!-- Guest -->
<rect x="60" y="470" width="262" height="190" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="82" y="512" font-family="EB Garamond, Georgia, serif" font-size="36">Guest</text>
<text x="82" y="548" fill="#8A8470">FILES</text>
<text x="82" y="574">Read, run</text>
<text x="82" y="608" fill="#8A8470">PROJECT</text>
<text x="82" y="634">Nothing</text>
<!-- Member -->
<rect x="338" y="370" width="262" height="290" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="360" y="418" font-family="EB Garamond, Georgia, serif" font-size="36">Member</text>
<text x="360" y="460" fill="#8A8470">FILES</text>
<text x="360" y="486">Read, write, run</text>
<text x="360" y="522" fill="#8A8470">PROJECT</text>
<text x="360" y="548">View members</text>
<!-- Delegate -->
<rect x="616" y="270" width="262" height="390" rx="12" fill="#FAF9F5" stroke="#D97757" stroke-width="3.5"/>
<text x="638" y="318" font-family="EB Garamond, Georgia, serif" font-size="36" fill="#D97757">Delegate</text>
<text x="638" y="360" fill="#8A8470">FILES</text>
<text x="638" y="386">Same as member</text>
<text x="638" y="422" fill="#8A8470">PROJECT</text>
<text x="638" y="448">Add members</text>
<text x="638" y="476">Remove members</text>
<text x="638" y="512" fill="#D97757" font-weight="600">Members only</text>
<!-- PI -->
<rect x="894" y="170" width="262" height="490" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="916" y="218" font-family="EB Garamond, Georgia, serif" font-size="36">PI (owner)</text>
<text x="916" y="260" fill="#8A8470">FILES</text>
<text x="916" y="286">Same as delegate</text>
<text x="916" y="322" fill="#8A8470">PROJECT</text>
<text x="916" y="348">Add, remove delegates</text>
<text x="916" y="376">Add guests</text>
<text x="916" y="404">View, update email</text>
<text x="916" y="432">View TTL</text>
</g>
<rect x="60" y="690" width="1096" height="46" rx="10" fill="#E6E2D6"/>
<text x="84" y="720" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" fill="#3D3929">Safe reading: delegates manage members; the PI manages delegates and guests.</text>
</svg>
