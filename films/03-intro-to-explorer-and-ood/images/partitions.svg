<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726" viewBox="0 0 1200 726">
<title>Partitions and time limits</title>
<desc>A bar chart of Explorer partitions by time limit seen in sinfo on 2026-10-11, with short at 2 days, sharing 1 hour, gpu 8 hours, gpu-short 2 hours and gpu-interactive 2 hours, and four more partitions that need approval or a course.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3D3929"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker>
</defs>
<rect width="1200" height="726" fill="#F2F0E9"/>
