<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<title>The right-size loop</title>
<desc>A four-step loop of test small with srun, submit with sbatch, measure with seff, and adjust, shown with the two seff reports from the lesson where job one used 8.29 percent of its CPU and job two used 3.56 percent of its memory.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3D3929"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D97757"/></marker>
</defs>
<rect width="1200" height="800" fill="#F2F0E9"/>
<text x="40" y="72" font-family="EB Garamond, Georgia, serif" font-size="44" font-weight="500" fill="#3D3929" text-anchor="start">Ask small, then measure</text>
<text x="40" y="108" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="start">The right-size loop</text>
<rect x="40" y="140" width="220" height="110" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="150" y="190" font-family="EB Garamond, Georgia, serif" font-size="26" font-weight="500" fill="#3D3929" text-anchor="middle">1  Test small</text>
<text x="150" y="226" font-family="Menlo, Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle">srun</text>
<rect x="340" y="140" width="220" height="110" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="450" y="190" font-family="EB Garamond, Georgia, serif" font-size="26" font-weight="500" fill="#3D3929" text-anchor="middle">2  Submit</text>
<text x="450" y="226" font-family="Menlo, Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle">sbatch</text>
<rect x="640" y="140" width="220" height="110" rx="12" fill="#FAF9F5" stroke="#D97757" stroke-width="4"/>
<text x="750" y="190" font-family="EB Garamond, Georgia, serif" font-size="26" font-weight="500" fill="#3D3929" text-anchor="middle">3  Measure</text>
<text x="750" y="226" font-family="Menlo, Consolas, Courier New, monospace" font-size="20" font-weight="400" fill="#D97757" text-anchor="middle">seff</text>
<rect x="940" y="140" width="220" height="110" rx="12" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="2.5"/>
<text x="1050" y="190" font-family="EB Garamond, Georgia, serif" font-size="26" font-weight="500" fill="#3D3929" text-anchor="middle">4  Adjust</text>
<text x="1050" y="226" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="middle">Ask more or less</text>
<line x1="266" y1="195" x2="334" y2="195" stroke="#3D3929" stroke-width="3" marker-end="url(#ah)"/>
<line x1="566" y1="195" x2="634" y2="195" stroke="#3D3929" stroke-width="3" marker-end="url(#ah)"/>
<line x1="866" y1="195" x2="934" y2="195" stroke="#3D3929" stroke-width="3" marker-end="url(#ah)"/>
<path d="M1050,256 C1050,330 450,330 450,262" fill="none" stroke="#3D3929" stroke-width="3" marker-end="url(#ah)"/>
<text x="750" y="332" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#8A8470" text-anchor="middle">Repeat until it fits</text>
<line x1="40" y1="372" x2="1160" y2="372" stroke="#CFC9B8" stroke-width="2"/>
<text x="40" y="412" font-family="EB Garamond, Georgia, serif" font-size="28" font-weight="500" fill="#3D3929" text-anchor="start">What seff reported for the lesson's two jobs</text>
<text x="40" y="455" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#3D3929" text-anchor="start">Job one, 12 cores</text>
<text x="316" y="501" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="end">CPU used</text>
<rect x="330" y="477" width="620" height="32" rx="6" fill="#E6E2D6"/>
<rect x="330" y="477" width="51.4" height="32" rx="6" fill="#3D3929"/>
<text x="966" y="503" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">8.29%</text>
<text x="316" y="551" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="end">Memory used</text>
<rect x="330" y="527" width="620" height="32" rx="6" fill="#E6E2D6"/>
<rect x="330" y="527" width="64.7" height="32" rx="6" fill="#3D3929"/>
<text x="966" y="553" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">10.44%</text>
<text x="40" y="605" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#3D3929" text-anchor="start">Job two, 8 cores</text>
<text x="316" y="651" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="end">CPU used</text>
<rect x="330" y="627" width="620" height="32" rx="6" fill="#E6E2D6"/>
<rect x="330" y="627" width="519.7" height="32" rx="6" fill="#3D3929"/>
<text x="966" y="653" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#3D3929" text-anchor="start">83.83%</text>
<text x="316" y="701" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#8A8470" text-anchor="end">Memory used</text>
<rect x="330" y="677" width="620" height="32" rx="6" fill="#E6E2D6"/>
<rect x="330" y="677" width="22.1" height="32" rx="6" fill="#D97757"/>
<text x="966" y="703" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#D97757" text-anchor="start">3.56%</text>
<text x="40" y="761" font-family="EB Garamond, Georgia, serif" font-size="26" font-weight="500" fill="#3D3929" text-anchor="start">Check both numbers</text>
</svg>
