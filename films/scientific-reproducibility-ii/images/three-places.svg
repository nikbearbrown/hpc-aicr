<svg xmlns="http://www.w3.org/2000/svg" width="1200" viewBox="0 0 1200 520" role="img">
<title>Three places a file lives in Git</title>
<desc>A file moves from the working tree to the staging area with git add, then into the repository with git commit.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3D3929"/></marker></defs>
<rect width="1200" height="520" fill="#F2F0E9"/>
<text x="60" y="80" font-family="EB Garamond, Georgia, serif" font-size="46" fill="#3D3929">Three places a file lives</text>
<g font-family="EB Garamond, Georgia, serif" font-size="36" fill="#3D3929" text-anchor="middle">
<rect x="60" y="180" width="250" height="230" rx="14" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="3"/>
<text x="185" y="260">Working tree</text>
<rect x="475" y="180" width="250" height="230" rx="14" fill="#FAF9F5" stroke="#D97757" stroke-width="4"/>
<text x="600" y="260">Staging area</text>
<rect x="890" y="180" width="250" height="230" rx="14" fill="#FAF9F5" stroke="#CFC9B8" stroke-width="3"/>
<text x="1015" y="260">Repository</text>
</g>
<g font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#8A8470" text-anchor="middle">
<text x="185" y="320">files you see</text><text x="600" y="320">next snapshot</text><text x="1015" y="320">saved snapshots</text>
<text x="185" y="360">edited by you</text><text x="600" y="360">filled by git add</text><text x="1015" y="360">made by git commit</text>
</g>
<g stroke="#3D3929" stroke-width="3" fill="none"><path d="M320 295H465" marker-end="url(#a)"/><path d="M735 295H880" marker-end="url(#a)"/></g>
<g font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#3D3929" text-anchor="middle">
<text x="392" y="270">git add</text><text x="807" y="270">git commit</text></g>
</svg>
