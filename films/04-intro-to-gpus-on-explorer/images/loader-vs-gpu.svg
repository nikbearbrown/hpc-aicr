<rect x="470" y="454" width="104" height="50" rx="8" fill="#E6E2D6" stroke="#8A8470" stroke-width="2"/>
<text x="522.0" y="486" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#3D3929" text-anchor="middle">prep 3</text>
<rect x="580" y="534" width="104" height="50" rx="8" fill="#3D3929" stroke="#3D3929" stroke-width="0"/>
<text x="632.0" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#FAF9F5" text-anchor="middle">run 3</text>
<rect x="580" y="454" width="104" height="50" rx="8" fill="#E6E2D6" stroke="#8A8470" stroke-width="2"/>
<text x="632.0" y="486" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#3D3929" text-anchor="middle">prep 4</text>
<rect x="690" y="534" width="104" height="50" rx="8" fill="#3D3929" stroke="#3D3929" stroke-width="0"/>
