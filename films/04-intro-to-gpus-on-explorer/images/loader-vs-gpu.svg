<text x="302" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#D97757" text-anchor="middle">idle</text>
<text x="302" y="276" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#D97757" text-anchor="middle">idle</text>
<text x="520" y="276" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#D97757" text-anchor="middle">idle</text>
