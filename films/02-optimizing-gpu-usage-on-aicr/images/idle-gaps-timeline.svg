<line x1="810.0" y1="476" x2="810.0" y2="486" stroke="#3D3929" stroke-width="2.5"/>
<text x="810.0" y="512" font-size="18" font-weight="400" fill="#8A8470" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" >90 ms</text>
<line x1="1085.0" y1="476" x2="1085.0" y2="486" stroke="#3D3929" stroke-width="2.5"/>
<text x="1085.0" y="512" font-size="18" font-weight="400" fill="#8A8470" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" >135 ms</text>
<rect x="60" y="556" width="1080" height="92" rx="14" fill="#FBEDE6" stroke="#D97757" stroke-width="3.5" />
<text x="100" y="614" font-size="30" font-weight="500" fill="#D97757" text-anchor="start" font-family="EB Garamond, Georgia, serif" >9 ms working, 36 ms waiting: 80% of the time wasted</text>
<text x="60" y="688" font-size="18" font-weight="400" fill="#8A8470" text-anchor="start" font-family="Inter, Helvetica, Arial, sans-serif" >Source: the workshop quiz, as taught in the guide. A sketch of one idea, not a measured run.</text>

</svg>
