<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="716" viewBox="0 0 1200 716">
<title>A GPU waiting on data</title>
<desc>A timeline showing a data loader taking 45 ms per batch while the GPU computes for 9 ms and then waits 36 ms, so 80 percent of its time is wasted.</desc>
